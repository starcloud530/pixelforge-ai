<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="google" content="notranslate">
<title>动作预览</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f25;
    --stage: #101216;
    --line: #343a44;
    --text: #f3efe6;
    --muted: #a59d90;
    --accent: #f4a259;
    --ink: #1c140c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    line-height: 1.45;
  }
  button, select { font: inherit; color: inherit; }
  button {
    background: #2a3038;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
  }
  button:hover { border-color: #5c6572; }
  button:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.primary {
    background: var(--accent);
    color: var(--ink);
    border-color: #d9863a;
    min-width: 5.5rem;
    font-weight: 650;
  }
  button.is-current, button.is-active {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  select {
    background: #2a3038;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
  }
  .app {
    max-width: 920px;
    margin: 0 auto;
    padding: 1.25rem 1rem 2rem;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .eyebrow {
    margin: 0;
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0.15rem 0 0;
    font-size: 1.35rem;
    font-weight: 650;
    word-break: break-all;
  }
  .pill {
    margin: 0;
    padding: 0.3rem 0.55rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }
  .error {
    margin: 0 0 0.8rem;
    padding: 0.65rem 0.8rem;
    border: 1px solid #8a4a3a;
    background: #2a1814;
    color: #ffd7cc;
    border-radius: 8px;
  }
  .stage {
    overflow: auto;
    display: grid;
    place-items: center;
    min-height: 280px;
    padding: 1.25rem;
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 12px 12px 0 0;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .deck {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 0.85rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 12px 12px;
  }
  .row, .group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
  }
  .transport { justify-content: space-between; }
  label { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--muted); }
  .badge, .status, .hint {
    font-variant-numeric: tabular-nums;
  }
  .badge {
    padding: 0.15rem 0.45rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .status { margin-left: auto; }
  .hint { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .group-label {
    color: var(--muted);
    font-size: 0.82rem;
  }
  .steps { display: flex; gap: 4px; overflow-x: auto; }
  .step {
    min-width: 1.8rem;
    padding: 0.2rem 0.35rem;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.75rem;
  }
  .step.is-current { color: var(--accent); }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <p class="eyebrow">PixelForge</p>
      <h1 id="title">动作预览</h1>
    </div>
    <p class="pill" id="meta">只读</p>
  </header>
  <p id="error" class="error" role="alert" hidden></p>
  <div class="stage">
    <canvas id="view" width="16" height="16" aria-describedby="status"></canvas>
  </div>
  <section class="deck" aria-label="播放控制">
    <div class="row">
      <label>动作
        <select id="action"></select>
      </label>
      <span id="loop" class="badge"></span>
      <span id="status" class="status"></span>
    </div>
    <div class="steps" id="steps" role="group" aria-label="播放顺序"></div>
    <div class="row transport">
      <div class="group">
        <button id="to-start" type="button">起点</button>
        <button id="step-back" type="button">上一帧</button>
        <button id="play" type="button" class="primary">播放</button>
        <button id="step-fwd" type="button">下一帧</button>
      </div>
      <label>速度
        <select id="speed"></select>
      </label>
    </div>
    <div class="row">
      <span class="group-label">缩放</span>
      <div class="group" id="scales" role="group" aria-label="整数倍缩放"></div>
      <span class="group-label">背景</span>
      <div class="group" id="backgrounds" role="group" aria-label="背景"></div>
    </div>
    <p id="clock" class="hint"></p>
  </section>
</main>
<script>
/*__PLAYBACK_JS__*/
</script>
<script>
(function () {
  const api = globalThis.PixelforgePlayback;
  const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
  const snapshotUrl = new URL("snapshot", location.origin + base).href;
  const title = document.querySelector("#title");
  const meta = document.querySelector("#meta");
  const errorBox = document.querySelector("#error");
  const canvas = document.querySelector("#view");
  const ctx = canvas.getContext("2d");
  const actionSelect = document.querySelector("#action");
  const loopBadge = document.querySelector("#loop");
  const status = document.querySelector("#status");
  const steps = document.querySelector("#steps");
  const playButton = document.querySelector("#play");
  const speedSelect = document.querySelector("#speed");
  const scaleGroup = document.querySelector("#scales");
  const backgroundGroup = document.querySelector("#backgrounds");
  const clock = document.querySelector("#clock");
  const loopLabel = {
    forward: "正向循环",
    reverse: "反向循环",
    pingpong: "往返",
    once: "播放一次",
  };
  const backgroundLabel = {
    checker: "棋盘",
    black: "黑",
    white: "白",
    gray: "灰",
  };
  let player = null;
  let etag = null;
  let holdingError = false;
  let actionIds = "";
  let stepSignature = "";
  const images = new Map();
  let imageRevision = null;

  api.SPEEDS.forEach(function (value) {
    const option = document.createElement("option");
    option.value = String(value);
    option.textContent = value + "×";
    if (value === 1) option.selected = true;
    speedSelect.appendChild(option);
  });
  api.SCALES.forEach(function (value) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = value + "×";
    button.dataset.scale = String(value);
    button.addEventListener("click", function () {
      if (!player) return;
      player.setScale(value);
      render();
    });
    scaleGroup.appendChild(button);
  });
  Object.keys(backgroundLabel).forEach(function (name) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = backgroundLabel[name];
    button.dataset.background = name;
    button.addEventListener("click", function () {
      if (!player) return;
      player.setBackground(name);
      render();
    });
    backgroundGroup.appendChild(button);
  });

  function showError(message, held) {
    errorBox.hidden = false;
    errorBox.textContent = held
      ? "读取失败：" + message + "。画面暂停在上一份有效快照。源文件恢复后会重新加载，不会写回工程。"
      : "读取失败：" + message + "。还没有可显示的画面。源文件恢复后会重新加载，不会写回工程。";
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = "";
  }

  function spriteImage(state) {
    if (imageRevision !== state.revision) {
      images.clear();
      imageRevision = state.revision;
    }
    const key = String(state.frame);
    let image = images.get(key);
    if (!image) {
      image = new Image();
      image.src = "data:image/png;base64," + state.png;
      images.set(key, image);
    }
    return image;
  }

  function render() {
    if (!player) return;
    const state = player.state();
    title.textContent = state.fileName || "动作预览";
    document.title = title.textContent;
    meta.textContent = "只读 · " + String(state.revision || "").slice(0, 8);
    if (state.error) showError(state.error, true);
    else clearError();

    const ids = state.actions.map(function (item) { return item.id; }).join("\n");
    if (actionSelect.dataset.ids !== ids) {
      actionSelect.replaceChildren();
      state.actions.forEach(function (item) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.name;
        actionSelect.appendChild(option);
      });
      actionSelect.dataset.ids = ids;
    }
    if (actionSelect.value !== state.actionId) actionSelect.value = state.actionId;
    actionIds = ids;
    loopBadge.textContent = loopLabel[state.loop] || state.loop;
    const hold = state.finished ? "停在末帧 · " : "";
    status.textContent = hold + "第 " + (state.step + 1) + " / " + state.stepCount + " 步 · 帧 " + state.frame + " · " + state.delayMs + " ms";
    playButton.textContent = state.playing ? "暂停" : state.finished ? "重播" : "播放";
    speedSelect.value = String(state.speed);
    scaleGroup.querySelectorAll("button").forEach(function (button) {
      button.classList.toggle("is-active", Number(button.dataset.scale) === state.scale);
    });
    backgroundGroup.querySelectorAll("button").forEach(function (button) {
      button.classList.toggle("is-active", button.dataset.background === state.background);
    });
    const signature = state.actionId + "|" + state.steps.map(function (item) {
      return item.frame + ":" + item.delayMs;
    }).join(",");
    if (steps.dataset.signature !== signature) {
      steps.replaceChildren();
      state.steps.forEach(function (item, index) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "step";
        button.dataset.index = String(index);
        button.textContent = String(item.frame);
        button.title = "第 " + (index + 1) + " 步，帧 " + item.frame + "，" + item.delayMs + " ms";
        button.addEventListener("click", function () {
          player.jumpTo(index, performance.now());
          render();
        });
        steps.appendChild(button);
      });
      steps.dataset.signature = signature;
    }
    steps.querySelectorAll("button").forEach(function (button) {
      const current = Number(button.dataset.index) === state.step;
      button.classList.toggle("is-current", current);
      if (current) button.setAttribute("aria-current", "true");
      else button.removeAttribute("aria-current");
    });
    stepSignature = signature;
    const preview = Number.isInteger(state.previewMs) ? String(state.previewMs) : state.previewMs.toFixed(2);
    clock.textContent = "工程帧时长 " + state.delayMs + " ms，预览时钟 " + preview + " ms（" + state.speed + "×）。调速不改工程。空格播放或暂停，左右方向键逐帧。";

    if (!state.png) return;
    const image = spriteImage(state);
    const draw = function () {
      const live = player.state();
      if (live.revision !== state.revision || live.frame !== state.frame || live.scale !== state.scale || live.background !== state.background) return;
      api.paintFrame(ctx, image, live.width, live.height, live.scale, api.backgroundPaint(live.background));
    };
    if (image.complete && image.naturalWidth) draw();
    else image.addEventListener("load", draw, { once: true });
  }

  function toggle() {
    if (!player || player.state().error) return;
    const now = performance.now();
    if (player.state().playing) player.pause();
    else player.play(now);
    render();
  }

  document.querySelector("#play").addEventListener("click", toggle);
  document.querySelector("#step-back").addEventListener("click", function () {
    if (!player) return;
    player.stepBy(-1, performance.now());
    render();
  });
  document.querySelector("#step-fwd").addEventListener("click", function () {
    if (!player) return;
    player.stepBy(1, performance.now());
    render();
  });
  document.querySelector("#to-start").addEventListener("click", function () {
    if (!player) return;
    player.toStart(performance.now());
    render();
  });
  actionSelect.addEventListener("change", function () {
    if (!player) return;
    player.selectAction(actionSelect.value, performance.now());
    render();
  });
  speedSelect.addEventListener("change", function () {
    if (!player) return;
    player.setSpeed(Number(speedSelect.value), performance.now());
    render();
  });
  window.addEventListener("keydown", function (event) {
    if (!player) return;
    const tag = event.target && event.target.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (event.key === " ") {
      event.preventDefault();
      toggle();
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      player.stepBy(-1, performance.now());
      render();
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      player.stepBy(1, performance.now());
      render();
    } else if (event.key === "Home") {
      event.preventDefault();
      player.toStart(performance.now());
      render();
    }
  });

  function accept(payload) {
    if (payload && payload.ok === true) {
      holdingError = false;
      etag = payload.revision;
      if (!player) player = api.createPlayback(payload);
      else player.applySnapshot(payload, performance.now());
      render();
      return;
    }
    holdingError = true;
    etag = null;
    const message = (payload && payload.error) || "无法读取工程";
    if (player) {
      player.applySnapshot({ ok: false, error: message }, performance.now());
      render();
    } else {
      showError(message, false);
    }
  }

  async function poll() {
    try {
      const headers = { Accept: "application/json" };
      if (etag && !holdingError) headers["If-None-Match"] = '"' + etag + '"';
      const response = await fetch(snapshotUrl, { headers: headers, cache: "no-store" });
      if (response.status === 304) return;
      accept(await response.json());
    } catch (err) {
      holdingError = true;
      etag = null;
      const message = "预览服务没有响应";
      if (player) {
        player.applySnapshot({ ok: false, error: message }, performance.now());
        render();
      } else {
        showError(message, false);
      }
    }
  }

  function loop(now) {
    if (player && !player.state().error) player.tick(now);
    if (player && player.state().playing) render();
    requestAnimationFrame(loop);
  }

  poll();
  setInterval(poll, 400);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
