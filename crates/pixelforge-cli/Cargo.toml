[package]
name = "pixelforge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local pixelforge command: open a pixelforge-project and call the kernel Tool API."
repository = "https://github.com/starcloud530/pixelforge-ai"
build = "build.rs"

[[bin]]
name = "pixelforge"
path = "src/main.rs"

# Workspace `publish = false` keeps this crate off crates.io. `dist = true`
# opts the pixelforge binary into GitHub Release builds. See dist-workspace.toml.
[package.metadata.dist]
dist = true

[dependencies]
# Pinned for the repo's Rust 1.83 floor. Newer clap releases may raise MSRV.
# `std::fs::File::lock` arrived in Rust 1.89, so the lock is `fs4`'s
# `flock(2)` / `LockFileEx` wrapper. Pin it so a later release cannot raise MSRV.
base64 = "=0.22.1"
clap = { version = "=4.5.23", features = ["derive"] }
fs4 = "=1.1.0"
pixelforge-kernel = { path = "../pixelforge-kernel" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
pixelforge-kernel = { path = "../pixelforge-kernel" }
serde_json = "1"

[target."cfg(unix)".dependencies]
libc = "=0.2.169"

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
