[package]
name = "pixelforge-kernel-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "wasm-bindgen bridge from the PixelForge kernel into the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned: 0.2.129's library builds on the documented Rust 1.83 minimum.
# wasm-pack downloads the matching prebuilt CLI.
wasm-bindgen = "=0.2.129"
pixelforge-kernel = { path = "../pixelforge-kernel" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
