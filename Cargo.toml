[workspace]
resolver = "2"
members = [
    "crates/pixelforge-kernel",
    "crates/pixelforge-kernel-wasm",
    "crates/pixelforge-cli",
]

[workspace.package]
edition = "2021"
# A release tag is `v` plus this string (`v0.1.0`, or `v0.1.0-rc.4` after
# this field is set to that). Every crate inherits it. See docs/dev-setup.md.
version = "0.1.0-rc.4"
license = "MIT OR Apache-2.0"
publish = false

# `dist build` passes `--profile dist`. `dist generate` does not create this.
[profile.dist]
inherits = "release"
lto = "thin"
