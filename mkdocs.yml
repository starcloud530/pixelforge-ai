# PixelForge docs — MkDocs Material → GitHub Pages (docs-only).
# Marketing landing: https://starcloud530.github.io/pixelforge-demos/
# Local: pip install -r requirements-docs.txt && mkdocs serve
# Docs URL: https://starcloud530.github.io/pixelforge-ai/

site_name: PixelForge 文档
site_description: 安装、评估与接入 PixelForge，验证可编辑像素工程、动画图集和导出工作流。
site_url: https://starcloud530.github.io/pixelforge-ai/
site_author: PixelForge contributors

repo_name: starcloud530/pixelforge-ai
repo_url: https://github.com/starcloud530/pixelforge-ai
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    logo: material/grid
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/pixelforge.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/starcloud530/pixelforge-ai
    - icon: fontawesome/solid/box-open
      link: https://github.com/starcloud530/pixelforge-ai/releases

# Existing docs link to repo paths outside docs/ (skills, examples, LICENSE).
# Those stay valid on GitHub; Pages only ships docs/*.md.
validation:
  nav:
    omitted_files: ignore
    not_found: ignore
    absolute_links: ignore
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: ignore

nav:
  - 产品文档: index.md
  - 评估与安装:
      - 示例工程验证: showcase.md
      - 安装与快速开始: install.md
      - 已知边界: known-limits.md
      - 许可与依赖: licensing.md
  - 工作流与集成:
      - Agent 与 CLI: agent-skill.md
      - 导出与引擎导入: export.md
      - 项目清单: project-manifest.md
      - Tool API: tool-api.md
  - 开发与质量:
      - 开发环境: dev-setup.md
      - 技术栈: tech-stack.md
      - 检查与性能: quality.md
      - 浏览器 AI 演示: ai-driver.md
      - 愿景: vision.md
      - Lighthouse 图块地图试验: trials/111-lighthouse-tilemap.md
  - 像素画室: /pixelforge-demos/
